folder: your_folder

meta:
  dtype: bfloat16
  resume_checkpoint: null
  load_predictor: true
  load_encoder: true
  pretrain_checkpoint: your_checkpoint
  dreamer_predictor_checkpoint: your_checkpoint
  context_encoder_key: target_encoder
  target_encoder_key: target_encoder
  seed: 239
  use_sdpa: true

model:
  model_name: vit_giant_xformers
  pred_depth: 24
  pred_embed_dim: 1024
  pred_is_frame_causal: true
  pred_num_heads: 16

  uniform_power: true
  use_extrinsics: false
  has_cls_first: false
  img_temporal_dim_size: 1
  interpolate_rope: true
  lambda_progressive: false
  lambda_value_img: 0.5
  lambda_value_vid: 0.5
  modality_embedding: true
  n_registers: 0
  normalize_predictor: false

  use_activation_checkpointing: true
  use_mask_tokens: true
  use_rope: true
  use_silu: false
  use_pred_silu: false
  zero_init_mask_tokens: true
  wide_silu: true
  compile_model: false

data:
  crop_size: 256
  patch_size: 16
  tubelet_size: 2
  # MUST equal data_aug in configs/train/vjepa_2_1_dreamer_ac.yaml. These are
  # not random augmentation here: with scale > 1 every crop attempt fails and
  # the transform falls back deterministically to the whole frame. Upstream
  # deploy used (1.0, 1.0), which centre-crops away 25% of each 640x480 frame.
  random_resize_scale: [1.777, 1.777]
  random_resize_aspect_ratio: [0.75, 1.35]

  datasets:
    - dummy
  dataset_fpcs:
    - 1

loss:
  normalize_reps: true
  auto_steps: 1

optimization:
  ipe: null
  weight_decay: 0.0
  final_weight_decay: 0.0
  epochs: 1
  anneal: false
  warmup: 0
  start_lr: 0.0
  lr: 0.0
  final_lr: 0.0
  enc_lr_scale: 1.0
  betas: [0.9, 0.999]
  eps: 1.0e-8

wandb:
  project: deploy
  name: deploy

deploy:
  server_ip: "127.0.0.1"
  server_port: 9001

  reference_h5: your_reference_h5

  image_key: "observations/images/right_shoulder_rgb"

  # frame_skip = ref_data_fps // ref_target_fps must equal ONE ACTION's span in
  # raw frames. train.py passes tubelet_size=1 to init_data (overriding the
  # config's 2), so that span is ceil(data_fps / fps) of the stage 2 config.
  # Paper Table 9 is 5 fps; the sim data is captured at 20 Hz (dt=0.05), so one
  # action = 4 raw frames and frame_skip must be 4. Paper SS3.1 gives no value
  # but requires the offset be "aligned with the planning frequency".
  #
  # prepare_deploy_config.py OVERWRITES both from the data's dt and the stage 2
  # config, so they cannot drift from training. The values here are only what
  # those derivations produce for the current data.
  #
  # (An earlier revision set 20/10 = frame_skip 2 from a wrong reading of the
  # dataloader; upstream shipped 30/5 = 6, sized for different data.)
  ref_data_fps: 20
  ref_target_fps: 5

  # UNCALIBRATED. 0.28 is the code default in deploy.py; the shipped 1.0 sits
  # just under chance (~1.13 in layer-normed space), so the test always passes,
  # the reference advances EVERY step, the demo is exhausted in ~1/6 of the
  # episode and the goal freezes on its final frame. Calibrate properly with
  # cem_utils.calibrate_threshold_from_sequence() and replace this.
  l1_threshold: 0.28
  queue_horizon: 4
  max_steps: -1

  abs_gripper: true
  discrete_gripper: false

  mpc:
    rollout: 1
    samples: 200
    topk: 10
    cem_steps: 50
    momentum_mean: 0.15
    momentum_std: 0.75
    # Bound on each action component, and ALSO the CEM sampling std. Sized to
    # ONE 4-raw-frame action: held-out GT at that stride reached |z| 0.045,
    # |x| 0.020, |y| 0.017 m (dummy_test, variation0_0000). That is ONE episode
    # -- confirm across the val set before trusting it (RUNBOOK_LAB step 6).
    # Should rarely bind once the model responds to actions; if every component
    # still pins to +/-maxnorm on every step, check act-resp0 before tuning this.
    maxnorm: 0.05
    verbose: true