folder: /mnt/jayyoung/codeHub/vjepa2/exp/deploy_tmp

meta:
  dtype: bfloat16
  resume_checkpoint: null
  load_predictor: true
  load_encoder: true
  pretrain_checkpoint: /mnt/jayyoung/codeHub/vjepa2/exp/jepa_2_1_dreamer_ac_real_final/e175.pt
  dreamer_predictor_checkpoint: /mnt/jayyoung/codeHub/vjepa2/exp/jepa_2_1_dreamer_predictor_real_22/e300.pt
  context_encoder_key: target_encoder
  target_encoder_key: target_encoder
  seed: 239
  use_sdpa: true

model:
  model_name: vit_giant_xformers
  pred_depth: 24
  pred_embed_dim: 1024
  pred_is_frame_causal: true
  pred_num_heads: 16

  uniform_power: true
  use_extrinsics: false
  has_cls_first: false
  img_temporal_dim_size: 1
  interpolate_rope: true
  lambda_progressive: false
  lambda_value_img: 0.5
  lambda_value_vid: 0.5
  modality_embedding: true
  n_registers: 0
  normalize_predictor: false

  use_activation_checkpointing: true
  use_mask_tokens: true
  use_rope: true
  use_silu: false
  use_pred_silu: false
  zero_init_mask_tokens: true
  wide_silu: true
  compile_model: false

data:
  crop_size: 256
  patch_size: 16
  tubelet_size: 2

  datasets:
    - dummy
  dataset_fpcs:
    - 1

loss:
  normalize_reps: true
  auto_steps: 1

optimization:
  ipe: null
  weight_decay: 0.0
  final_weight_decay: 0.0
  epochs: 1
  anneal: false
  warmup: 0
  start_lr: 0.0
  lr: 0.0
  final_lr: 0.0
  enc_lr_scale: 1.0
  betas: [0.9, 0.999]
  eps: 1.0e-8

wandb:
  project: deploy
  name: deploy

deploy:
  server_ip: "127.0.0.1"
  server_port: 9001

  reference_h5: "/mnt/log2r/RLBench/paired_data_new_get_ice_from_fridge/get_ice_from_fridge/variation0/0002/episodes/episode0/panda/episode.hdf5"

  image_key: "observations/images/right_shoulder_rgb"

  ref_data_fps: 30
  ref_target_fps: 5

  l1_threshold: 1.0
  queue_horizon: 4
  max_steps: -1

  abs_gripper: true
  discrete_gripper: false

  mpc:
    rollout: 1
    samples: 200
    topk: 10
    cem_steps: 50
    momentum_mean: 0.15
    momentum_std: 0.75
    maxnorm: 0.1
    verbose: true