folder: your_folder

meta:
  dtype: bfloat16
  resume_checkpoint: null
  load_predictor: true
  load_encoder: true
  pretrain_checkpoint: your_checkpoint
  dreamer_predictor_checkpoint: your_checkpoint
  context_encoder_key: target_encoder
  target_encoder_key: target_encoder
  seed: 239
  use_sdpa: true

model:
  model_name: vit_giant_xformers
  pred_depth: 24
  pred_embed_dim: 1024
  pred_is_frame_causal: true
  pred_num_heads: 16

  uniform_power: true
  use_extrinsics: false
  has_cls_first: false
  img_temporal_dim_size: 1
  interpolate_rope: true
  lambda_progressive: false
  lambda_value_img: 0.5
  lambda_value_vid: 0.5
  modality_embedding: true
  n_registers: 0
  normalize_predictor: false

  use_activation_checkpointing: true
  use_mask_tokens: true
  use_rope: true
  use_silu: false
  use_pred_silu: false
  zero_init_mask_tokens: true
  wide_silu: true
  compile_model: false

data:
  crop_size: 256
  patch_size: 16
  tubelet_size: 2

  datasets:
    - dummy
  dataset_fpcs:
    - 1

loss:
  normalize_reps: true
  auto_steps: 1

optimization:
  ipe: null
  weight_decay: 0.0
  final_weight_decay: 0.0
  epochs: 1
  anneal: false
  warmup: 0
  start_lr: 0.0
  lr: 0.0
  final_lr: 0.0
  enc_lr_scale: 1.0
  betas: [0.9, 0.999]
  eps: 1.0e-8

wandb:
  project: deploy
  name: deploy

deploy:
  server_ip: "127.0.0.1"
  server_port: 9001

  reference_h5: your_reference_h5

  image_key: "observations/images/right_shoulder_rgb"

  # frame_skip = ref_data_fps // ref_target_fps must equal the AC predictor's
  # action stride, which is 2 * ceil(data_fps / fps) raw frames -- see
  # app/vjepa_2_1_dreamer_ac/dataset.py (primary_states[::frameskip], frameskip
  # = tubelet_size). The stage 2 checkpoint we have was trained with
  # data_fps=fps=5 -> ceil=1, tubelet 2 -> ONE ACTION = 2 RAW FRAMES.
  # Source data is 20 Hz (server dt=0.05; a 93-frame push_button demo = 4.6 s),
  # so 20 -> 10 gives frame_skip 2 and the numbers describe reality.
  #
  # Upstream shipped 30/5 = 6. Against a 2-frame action that makes the goal 3x
  # further than any single step can reach, so the CEM cost is monotone over the
  # whole action box and every component pins to +/-maxnorm on every step. The
  # paper (arXiv 2605.20811 SS3.1) states no value for this offset but does
  # require it be "aligned with the planning frequency" -- 30/5 is not.
  ref_data_fps: 20
  ref_target_fps: 10

  # UNCALIBRATED. 0.28 is the code default in deploy.py; the shipped 1.0 sits
  # just under chance (~1.13 in layer-normed space), so the test always passes,
  # the reference advances EVERY step, the demo is exhausted in ~1/6 of the
  # episode and the goal freezes on its final frame. Calibrate properly with
  # cem_utils.calibrate_threshold_from_sequence() and replace this.
  l1_threshold: 0.28
  queue_horizon: 4
  max_steps: -1

  abs_gripper: true
  discrete_gripper: false

  mpc:
    rollout: 1
    samples: 200
    topk: 10
    cem_steps: 50
    momentum_mean: 0.15
    momentum_std: 0.75
    # Bound on each action component, and ALSO the CEM sampling std. Sized to
    # the stride-2 training action scale: raw per-frame |dxyz| is mean 5 mm /
    # max 11 mm, so one 2-frame action is mean ~10 mm / max ~22 mm. 0.02 lets
    # the planner express the range it was trained on without going far past it.
    # Upstream 0.1 is ~5x the training max. Once ref_data_fps is correct this
    # should rarely bind -- if actions still sit at +/-maxnorm every step, the
    # goal is still unreachable and the world model is the next suspect.
    maxnorm: 0.02
    verbose: true